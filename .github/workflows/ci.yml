# Runs on every push and pull request. A red check blocks merging (set branch
# protection on `main` in GitHub: Settings -> Branches -> require "CI").
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true   # a new push cancels the old run

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Core + dev tools only. The vision stack (torch, ~1 GB) is not needed:
      # vision tests are marked and deselected below.
      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check src tests --output-format github
          ruff format --check src tests

      - name: Type check (mypy)
        run: mypy

      - name: Tests
        run: pytest -m "not vision" --cov --cov-report=xml --cov-fail-under=80

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: fall-detector:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
